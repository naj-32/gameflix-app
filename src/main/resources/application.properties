# DATASOURCE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/demo40?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JWT CONFIGURATION
app.jwt.secret=${JWT_SECRET}

# JPA / HIBERNATE PROPERTIES
# Hibernate 7 (Spring Boot 4) automatically detects the best dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# DEVTOOLS
# LiveReload is disabled by default in Spring Boot 4 and must be enabled explicitly
spring.devtools.livereload.enabled=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE
  spring.application.name=demo
